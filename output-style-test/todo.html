<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투두 리스트</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 40px 16px; }
  .app { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { margin: 0 0 16px; font-size: 22px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 15px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  li button { background: transparent; color: #ef4444; padding: 4px 8px; }
  .count { margin-top: 12px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
<div class="app">
  <h1>📝 투두 리스트</h1>
  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" required>
    <button type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  const count = document.getElementById('count');

  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch (e) {}

  function save() {
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
  }

  function render() {
    list.innerHTML = '';
    todos.forEach((todo, i) => {
      const li = document.createElement('li');
      if (todo.done) li.className = 'done';

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = todo.done;
      check.onchange = () => { todo.done = check.checked; save(); render(); };

      const text = document.createElement('span');
      text.textContent = todo.text;

      const del = document.createElement('button');
      del.textContent = '✕';
      del.onclick = () => { todos.splice(i, 1); save(); render(); };

      li.append(check, text, del);
      list.append(li);
    });
    const left = todos.filter(t => !t.done).length;
    count.textContent = todos.length ? `남은 할 일 ${left}개 / 전체 ${todos.length}개` : '할 일이 없습니다.';
  }

  // 새 할 일을 추가해도 되는지 판단한다. 추가 가능하면 true, 아니면 false를 반환한다.
  function validateTodo(text) {
    // TODO(human): 검증 규칙을 구현하세요.
    return true;
  }

  form.onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !validateTodo(text)) return;
    todos.push({ text, done: false });
    input.value = '';
    save();
    render();
  };

  render();
</script>
</body>
</html>
