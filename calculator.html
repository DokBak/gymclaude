<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1f26;
    font-family: -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  }
  .calc {
    width: 320px;
    padding: 20px;
    background: #2a2c36;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .display {
    background: #1a1b21;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    text-align: right;
    height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history { color: #7c8094; font-size: 14px; min-height: 20px; }
  .current { color: #fff; font-size: 36px; word-break: break-all; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    height: 56px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    color: #fff;
    background: #3a3d4a;
    cursor: pointer;
    transition: filter .1s, transform .05s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.95); }
  button.op { background: #f5a623; }
  button.fn { background: #5a5e70; }
  button.eq { background: #4caf50; }
  button.zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="back">⌫</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="÷">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="×">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="−">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-act="dot">.</button>
    <button class="eq" data-act="equals">=</button>
  </div>
</div>

<script>
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');

  let current = '0';
  let prev = null;
  let op = null;
  let justEvaluated = false;

  function format(str) {
    if (str === 'Error') return str;
    const [int, dec] = str.split('.');
    const sign = int.startsWith('-') ? '-' : '';
    const digits = int.replace('-', '');
    const withComma = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return sign + withComma + (dec !== undefined ? '.' + dec : '');
  }

  function render() {
    currentEl.textContent = format(current);
    currentEl.style.fontSize = current.length > 12 ? '24px' : '36px';
    historyEl.textContent = op ? `${format(String(prev))} ${op}` : '';
  }

  function compute(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
    }
  }

  function toStr(n) {
    if (!isFinite(n)) return 'Error';
    // TODO(human): 부동소수점 오차(예: 0.1 + 0.2 = 0.30000000000000004)를
    // 정리해서 화면에 표시할 문자열을 반환하세요.
    return String(n);
  }

  function inputNum(d) {
    if (current === 'Error' || justEvaluated) { current = '0'; justEvaluated = false; }
    current = current === '0' ? d : current + d;
    if (current.replace(/[-.]/g, '').length > 15) current = current.slice(0, -1);
    render();
  }

  function inputDot() {
    if (current === 'Error' || justEvaluated) { current = '0'; justEvaluated = false; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function chooseOp(o) {
    if (current === 'Error') return;
    if (op && !justEvaluated && prev !== null) {
      const r = compute(prev, parseFloat(current), op);
      current = toStr(r);
      if (current === 'Error') { prev = null; op = null; render(); return; }
    }
    prev = parseFloat(current);
    op = o;
    current = '0';
    justEvaluated = false;
    historyEl.textContent = `${format(String(prev))} ${op}`;
    currentEl.textContent = format(String(prev));
  }

  function equals() {
    if (!op || current === 'Error') return;
    const b = parseFloat(current);
    const r = compute(prev, b, op);
    historyEl.textContent = `${format(String(prev))} ${op} ${format(String(b))} =`;
    current = toStr(r);
    prev = null;
    op = null;
    justEvaluated = true;
    currentEl.textContent = format(current);
  }

  function clearAll() {
    current = '0'; prev = null; op = null; justEvaluated = false;
    render();
  }

  function back() {
    if (justEvaluated || current === 'Error') { clearAll(); return; }
    current = current.length > 1 ? current.slice(0, -1) : '0';
    if (current === '-') current = '0';
    render();
  }

  function percent() {
    if (current === 'Error') return;
    current = toStr(parseFloat(current) / 100);
    render();
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNum(b.dataset.num);
    else if (b.dataset.op) chooseOp(b.dataset.op);
    else if (b.dataset.act === 'dot') inputDot();
    else if (b.dataset.act === 'equals') equals();
    else if (b.dataset.act === 'clear') clearAll();
    else if (b.dataset.act === 'back') back();
    else if (b.dataset.act === 'percent') percent();
  });

  document.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) inputNum(e.key);
    else if (e.key === '.') inputDot();
    else if (e.key === '+') chooseOp('+');
    else if (e.key === '-') chooseOp('−');
    else if (e.key === '*') chooseOp('×');
    else if (e.key === '/') { e.preventDefault(); chooseOp('÷'); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') back();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') percent();
  });

  render();
</script>
</body>
</html>
